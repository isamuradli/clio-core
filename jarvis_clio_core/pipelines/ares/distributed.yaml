# =============================================================================
# Issue #526 — multi-node performance evaluation sweep (containerized).
# =============================================================================
#
# Sweeps the ior client node count 1 -> 2 -> 4 at a fixed I/O working point
# (xfer 1m, ppn 4, block 256m => 1 GiB written per node per phase) across three
# storage stacks, recording every run into one results.csv for day-over-day
# tracking.
#
#   1. NFS + ior           -> ior against the cluster's shared NFS home
#   2. CTE + libfuse + ior -> ior through the per-node CTE FUSE mounts
#   3. juicefs + ior       -> ior through per-node JuiceFS mounts, sharing one
#                             namespace via redis metadata on the head node
#
# Services stay up on all four nodes throughout; only the ior client fan
# varies, so no service churn is charged to a row. Each node runs its packages
# inside its own apptainer instance; ior's mpiexec runs inside the head
# instance and spawns remote ranks over the peer instances' sshd on port 2222.
#
# The CTE pool is registered on every node before any FUSE mount, under the
# default pool_name clio_cte_core (== the C++ kCtePoolName), so the FUSE
# client's AsyncCreate composes locally instead of racing cross-node.
# pool_query: local keeps each node's I/O node-local and the scaling symmetric.
#
# Usage:
#   bash <jarvis-cd>/docker/build_perf_eval_image.sh   # stage the SIF
#   jarvis ppl submit <abs path>/distributed.yaml
#
#   Needs jarvis-cd @ dev for container_fakeroot, run_timeout, builtin.ior's
#   container path + num_nodes, builtin.juicefs meta_use_head, host_pkgs, and
#   jarvis_cd.util.container_utils. apptainer is provisioned by the
#   config.host_pkgs block below — there is no spack view to build by hand.
#   Env overrides read by pre_cmds at job runtime: JARVIS_VENV, CLIO_REPO,
#   SPACK_ROOT — see single_node.yaml.
#
# Output:
#   ${HOME}/distributed_results/results.csv — 3 rows, one per node count.
#   Columns: {nfs_ior,cte_ior,jfs_ior}.write_max_mibs / .read_max_mibs /
#   .runtime.

scheduler:
  name: slurm
  job_name: perf_eval_distributed
  nodes: 4
  ntasks_per_node: 1
  cpus_per_task: 32
  partition: debug
  time: 04:00:00
  output: ${HOME}/distributed-%j.out
  error: ${HOME}/distributed-%j.err
  hostfile: ${HOME}/.jarvis-perf-eval/distributed_hostfile.txt
  pre_cmds:
  - if [ "$(id -gn)" != "$USER" ] && getent group "$USER" >/dev/null 2>&1; then echo "re-exec under group
    $USER for apptainer --fakeroot"; exec sg "$USER" -c "exec bash \"$0\""; fi
  - APPTAINER_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack
    location -i apptainer~suid 2>/dev/null || true )"
  - PATH="${APPTAINER_PREFIX:+$APPTAINER_PREFIX/bin:}${JARVIS_VENV:-$HOME/jarvis-venv}/bin:$PATH"
  - 'command -v jarvis >/dev/null 2>&1 || { echo "ERROR: jarvis not on PATH (venv: ${JARVIS_VENV:-$HOME/jarvis-venv})"
    >&2; exit 1; }'
  - 'echo "toolchain: jarvis=$(command -v jarvis) spack_root=${SPACK_ROOT:-$HOME/spack} apptainer=$(command
    -v apptainer || echo "<not yet installed; host_pkgs will install it>")"'
  - JSD=$(grep -hE "^[[:space:]]*shared_dir:" "$HOME"/.ppi-jarvis/*.yaml 2>/dev/null | head -1 | sed -E
    "s/^[[:space:]]*shared_dir:[[:space:]]*//" | tr -d "\"" || true)
  - "SIF=\"$JSD/containers/iowarp-perf-eval.sif\"; [ -n \"$JSD\" ] && [ -f \"$SIF\" ] || { echo \"ERROR:\
    \ SIF missing: $SIF \u2014 build via jarvis-cd docker/build_perf_eval_image.sh\" >&2; exit 1; }"
  - "srun --kill-on-bad-exit=0 --ntasks-per-node=1 bash -c '\n  command -v apptainer >/dev/null 2>&1 ||\
    \ { echo \"WARNING: $(hostname): apptainer not on PATH\"; exit 0; }\n  timeout 30 apptainer instance\
    \ stop --all >/dev/null 2>&1 || true\n  pkill -9 -f \"[c]himaera\" 2>/dev/null || true\n  pkill -9\
    \ -f \"[c]lio_run\" 2>/dev/null || true\n  { command -v fuser >/dev/null 2>&1 && fuser -k 9413/tcp;\
    \ } >/dev/null 2>&1 || true\n  rm -f /dev/shm/chi_* 2>/dev/null || true\n  find /tmp -maxdepth 1 \\\
    ( -name \"single_node*\" -o -name \"distributed*\" \\) -mmin +10 -exec rm -rf {} + 2>/dev/null ||\
    \ true\n  rm -rf /tmp/iowarp_chi* 2>/dev/null || true\n  echo \"prep done: $(hostname)\"\n' || echo\
    \ \"WARNING: per-node prep rc=$? \u2014 continuing\""
  - "if [ -z \"$APPTAINER_PREFIX\" ]; then\n  echo \"SKIP fakeroot preflight: apptainer not installed\
    \ yet (host_pkgs will install it)\"\nelse\nBAD=\"\"\nfor h in $(scontrol show hostnames \"$SLURM_JOB_NODELIST\"\
    ); do\n  if env -u LD_LIBRARY_PATH ssh -n -o BatchMode=yes \"$h\" \\\n      \"PATH=\\\"$APPTAINER_PREFIX/bin:\\\
    $PATH\\\" apptainer instance start --fakeroot $SIF pf_$$ >/dev/null 2>&1 && apptainer instance stop\
    \ pf_$$ >/dev/null 2>&1\"; then\n    echo \"fakeroot OK: $h\"\n  else\n    echo \"fakeroot FAILED:\
    \ $h\"\n    BAD=\"${BAD:+$BAD,}$h\"\n  fi\ndone\nif [ -n \"$BAD\" ]; then\n  echo \"ERROR: fakeroot\
    \ preflight failed on: $BAD\" >&2\n  echo \"Resubmit excluding them: set exclude: \\\"$BAD\\\" in\
    \ the scheduler block, or: sbatch --exclude=$BAD <pipeline shared_dir>/submit.slurm\" >&2\n  exit\
    \ 1\nfi\nfi"
  - mkdir -p "$HOME/perf_eval_scratch/distributed/nfs" "$HOME/perf_eval_scratch/distributed/jfs_data"
    "$HOME/cte_libfuse_perf_eval" "$HOME/distributed_results"
  - jarvis repo add "${CLIO_REPO:-$HOME/clio-core}/jarvis_clio_core" 2>/dev/null || true
  - rm -f "$HOME/distributed_results/results.csv"
  post_cmds:
  - df -h /tmp | tail -1
  - '{ command -v apptainer >/dev/null 2>&1 && timeout 30 apptainer instance stop --all; } >/dev/null
    2>&1 || true'
  - rm -rf /tmp/single_node* /tmp/distributed* /tmp/iowarp_chi* /tmp/iowarp_prte_tmp 2>/dev/null || true
  - rm -f /dev/shm/chi_* 2>/dev/null || true
  - echo "reclaimed node-local /tmp:"; df -h /tmp | tail -1
  - "RES=\"$HOME/distributed_results/results.csv\"; n=$(grep -c success \"$RES\" 2>/dev/null || true);\
    \ n=${n:-0}; echo \"successful rows: $n / 3\"; [ \"$n\" -ge 3 ] && echo \"ALL 3 GREEN\" || echo \"\
    INCOMPLETE \u2014 inspect $RES and the .err log\""
config:
  name: distributed
  hostfile: ${HOME}/.jarvis-perf-eval/distributed_hostfile.txt
  host_pkgs:
  - install_method: spack
    install_query: apptainer~suid
  ssh_cmd: env -u LD_LIBRARY_PATH ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  mpi_cmd: mpiexec --mca btl_tcp_if_include enp47s0np0 --mca oob_tcp_if_include eno1 --prtemca prte_if_include
    eno1 --prtemca prte_tmpdir_base /tmp/iowarp_prte_tmp
  base_deploy_mode: container
  container_engine: apptainer
  container_image: iowarp-perf-eval
  container_fakeroot: true
  tmp_bind_root: /tmp
  container_overlay_root: /tmp
  container_binds:
  - ${HOME}/perf_eval_scratch:${HOME}/perf_eval_scratch
  env:
    CLIO_MEMFD_DIR: /tmp/iowarp_chimaera
  pkgs:
  - pkg_type: builtin.redis
    pkg_name: redis
    port: 6379
    single_instance: true
    sleep: 4
  - pkg_type: jarvis_clio_core.clio_runtime
    pkg_name: runtime
    num_threads: 4
    port: 9413
    ipc_mode: shm
    log_level: info
    sleep: 4
    swim_enabled: false
    first_busy_wait: 200000
  - pkg_type: jarvis_clio_core.clio_cte
    pkg_name: cte_core
    devices:
    - - ram::cte_ram_tier1
      - 16GB
      - 1.0
    dpe_type: max_bw
    neighborhood: 1
    pool_query: local
    default_target_timeout_ms: 30000
    poll_period_ms: 5000
  - pkg_type: jarvis_clio_core.clio_cte_libfuse
    pkg_name: cte_fuse
    mountpoint: ${HOME}/cte_libfuse_perf_eval
    log_level: info
    extra_fuse_args: -f
    sleep: 2
  - pkg_type: builtin.juicefs
    pkg_name: juicefs
    meta_use_head: true
    meta_url: redis://127.0.0.1:6379/1
    storage: file
    data_dir: ${HOME}/perf_eval_scratch/distributed/jfs_data
    mountpoint: /tmp/jfs_mnt
    cache_dir: /tmp/juicefs_cache
    name: jfsbench
    format_fresh: true
    mount_wait: 20
  - pkg_type: builtin.ior
    pkg_name: nfs_ior
    api: posix
    write: true
    read: true
    fpp: true
    xfer: 1m
    block: 256m
    ppn: 4
    nprocs: 4
    num_nodes: 1
    stonewall: 120
    out: ${HOME}/perf_eval_scratch/distributed/nfs/ior_nfs.bin
  - pkg_type: builtin.ior
    pkg_name: cte_ior
    api: posix
    write: true
    read: true
    fpp: true
    xfer: 1m
    block: 256m
    ppn: 4
    nprocs: 4
    num_nodes: 1
    stonewall: 120
    out: ${HOME}/cte_libfuse_perf_eval/ior_cte.bin
  - pkg_type: builtin.ior
    pkg_name: jfs_ior
    api: posix
    write: true
    read: true
    fpp: true
    xfer: 1m
    block: 256m
    ppn: 4
    nprocs: 4
    num_nodes: 1
    stonewall: 120
    out: /tmp/jfs_mnt/ior_jfs.bin
vars:
  nfs_ior.num_nodes:
  - 1
  - 2
  - 4
  cte_ior.num_nodes:
  - 1
  - 2
  - 4
  jfs_ior.num_nodes:
  - 1
  - 2
  - 4
  nfs_ior.nprocs:
  - 4
  - 8
  - 16
  cte_ior.nprocs:
  - 4
  - 8
  - 16
  jfs_ior.nprocs:
  - 4
  - 8
  - 16
loop:
- - nfs_ior.num_nodes
  - cte_ior.num_nodes
  - jfs_ior.num_nodes
  - nfs_ior.nprocs
  - cte_ior.nprocs
  - jfs_ior.nprocs
run_timeout: 1800
repeat: 1
output: ${HOME}/distributed_results
