# =============================================================================
# Single-node perf sweep — FUSE SMALL-I/O TUNING (issue #933).
# =============================================================================
#
# single_node.yaml with the CTE FUSE adapter's new cache/upcall knobs turned
# on, and nothing else changed. It exists to answer one question: is CTE's
# small-I/O deficit amortization, or something deeper?
#
# The measurement that prompted it (4 KiB, 1 rank, same node):
#
#     CTE      15.0 MiB/s  =   3,840 ops/s
#     JuiceFS 540.3 MiB/s  = 138,300 ops/s     (36x)
#     NFS     338.5 MiB/s
#
# JuiceFS is ALSO FUSE, on the same kernel, and cannot be sustaining 138k
# single-threaded upcalls per second -- so it is not doing one upcall per
# 4 KiB. It ships attr/entry caches of 1.0s and a 300 MiB client buffer; the
# kernel absorbs most operations and hands userspace far fewer, larger ones.
# CTE's adapter shipped attr_timeout=entry_timeout=0 and write-through, so
# nothing amortized. At 1 MiB the two invert (CTE 794.8 vs JuiceFS 389.8 on
# write), which is what rules out bandwidth and the CTE data path.
#
# A server-side cache cannot fix this -- the interposer chain measured free
# for exactly that reason: pool 563.0 sits on the far side of the upcall being
# counted.
#
# Benchmarks four storage stacks back-to-back over one shared
# (I/O size x thread count) grid and records every run into a single
# results.csv, so a daily run can be diffed against yesterday's to catch
# performance regressions.
#
#   1. NFS + ior               -> ior against the cluster's NFS home
#   2. CTE + libfuse + ior     -> ior through the CTE FUSE mount
#   3. redis + redis-benchmark -> SET/GET against a node-local redis
#   4. juicefs + ior           -> ior through the JuiceFS FUSE mount
#
#   Grid: I/O size {4k, 64k, 128k, 1m} x thread count {1,2,4,8,16,32}
#         = 24 combinations. "threads" means MPI ranks (nprocs = ppn) for the
#         ior drivers, and -c clients / --threads for redis-benchmark.
#
# Every package runs inside one long-running apptainer instance on the node, so
# the CTE and JuiceFS FUSE mounts are visible to ior in the same mount
# namespace.
#
# Usage:
#   # Stage the SIF; re-run daily so the sweep tracks the latest IOWarp.
#   bash <jarvis-cd>/docker/build_perf_eval_image.sh
#   jarvis ppl submit <abs path>/single_node_fuse_tuned.yaml
#
#   Needs jarvis-cd @ dev for container_fakeroot, run_timeout, builtin.ior's
#   container path, builtin.juicefs, host_pkgs, and jarvis_cd.util.container_utils
#   (which the clio_* packages import). apptainer is provisioned by the
#   config.host_pkgs block below -- there is no spack view to build by hand.
#   pre_cmds expand when the JOB runs, so export any overrides before
#   submitting: JARVIS_VENV (jarvis venv, default $HOME/jarvis-venv), CLIO_REPO
#   (this checkout, default $HOME/clio-core), SPACK_ROOT (default $HOME/spack).
#
# Output:
#   ${HOME}/single_node_fuse_tuned_results/results.csv — 24 rows. Per-driver columns:
#   <ior pkg>.write_max_mibs / .read_max_mibs / .runtime, and
#   redis_bench.set_rps / .get_rps / .set_p50_ms / .get_p99_ms / .runtime
#   (redis-benchmark's raw CSV lands in the pipeline shared_dir).

scheduler:
  name: slurm
  job_name: perf_eval_single_node_fuse_tuned
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 32
  partition: debug
  time: '12:00:00'
  output: ${HOME}/single_node_fuse_tuned-%j.out
  error: ${HOME}/single_node_fuse_tuned-%j.err
  hostfile: ${HOME}/.jarvis-perf-eval/single_node_fuse_tuned_hostfile.txt
  pre_cmds:
  - if [ "$(id -gn)" != "$USER" ] && getent group "$USER" >/dev/null 2>&1; then echo "re-exec under group
    $USER for apptainer --fakeroot"; exec sg "$USER" -c "exec bash \"$0\""; fi
  - APPTAINER_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack
    location -i apptainer~suid 2>/dev/null || true )"
  - PATH="${APPTAINER_PREFIX:+$APPTAINER_PREFIX/bin:}${JARVIS_VENV:-$HOME/jarvis-venv}/bin:$PATH"
  - 'command -v jarvis >/dev/null 2>&1 || { echo "ERROR: jarvis not on PATH (venv: ${JARVIS_VENV:-$HOME/jarvis-venv})"
    >&2; exit 1; }'
  - 'echo "toolchain: jarvis=$(command -v jarvis) spack_root=${SPACK_ROOT:-$HOME/spack} apptainer=$(command
    -v apptainer || echo "<not yet installed; host_pkgs will install it>")"'
  - JSD=$(grep -hE "^[[:space:]]*shared_dir:" "$HOME"/.ppi-jarvis/*.yaml 2>/dev/null | head -1 | sed -E
    "s/^[[:space:]]*shared_dir:[[:space:]]*//" | tr -d "\"" || true)
  - "SIF=\"$JSD/containers/iowarp-perf-eval.sif\"; [ -n \"$JSD\" ] && [ -f \"$SIF\" ] || { echo \"ERROR:\
    \ SIF missing: $SIF \u2014 build via jarvis-cd docker/build_perf_eval_image.sh\" >&2; exit 1; }"
  - '{ command -v apptainer >/dev/null 2>&1 && timeout 30 apptainer instance stop --all; } >/dev/null
    2>&1 || true'
  - pkill -9 -f "[c]himaera" 2>/dev/null || true
  - pkill -9 -f "[c]lio_run" 2>/dev/null || true
  - '{ command -v fuser >/dev/null 2>&1 && fuser -k 9413/tcp; } >/dev/null 2>&1 || true'
  - rm -f /dev/shm/chi_* 2>/dev/null || true
  - find /tmp -maxdepth 1 \( -name "single_node*" -o -name "distributed*" \) -mmin +10 -exec rm -rf {}
    + 2>/dev/null || true
  - rm -rf /tmp/iowarp_chi* 2>/dev/null || true
  - mkdir -p "$HOME/perf_eval_scratch/single_node_fuse_tuned/nfs" "$HOME/perf_eval_scratch/single_node_fuse_tuned/jfs_data"
    "$HOME/single_node_fuse_tuned_results"
  - jarvis repo add "${CLIO_REPO:-$HOME/clio-core}/jarvis_clio_core" 2>/dev/null || true
  - rm -f "$HOME/single_node_fuse_tuned_results/results.csv"
  post_cmds:
  - df -h /tmp | tail -1
  - '{ command -v apptainer >/dev/null 2>&1 && timeout 30 apptainer instance stop --all; } >/dev/null
    2>&1 || true'
  - rm -rf /tmp/single_node* /tmp/distributed* /tmp/iowarp_chi* /tmp/iowarp_prte_tmp 2>/dev/null || true
  - rm -f /dev/shm/chi_* 2>/dev/null || true
  - echo "reclaimed node-local /tmp:"; df -h /tmp | tail -1
  - "RES=\"$HOME/single_node_fuse_tuned_results/results.csv\"; n=$(grep -c success \"$RES\" 2>/dev/null\
    \ || true); n=${n:-0}; echo \"successful rows: $n / 24\"; [ \"$n\" -ge 24 ] && echo \"ALL 24 GREEN\"\
    \ || echo \"INCOMPLETE \u2014 inspect $RES and the .err log\""
config:
  name: single_node_fuse_tuned
  hostfile: ${HOME}/.jarvis-perf-eval/single_node_fuse_tuned_hostfile.txt
  host_pkgs:
  - install_method: spack
    install_query: apptainer~suid
  base_deploy_mode: container
  container_engine: apptainer
  container_image: iowarp-perf-eval
  container_fakeroot: true
  tmp_bind_root: /tmp
  container_binds:
  - ${HOME}/perf_eval_scratch:${HOME}/perf_eval_scratch
  env:
    CLIO_MEMFD_DIR: /tmp/iowarp_chimaera
  pkgs:
  - pkg_type: builtin.redis
    pkg_name: redis
    port: 6379
    sleep: 4
  - pkg_type: jarvis_clio_core.clio_runtime
    pkg_name: runtime
    num_threads: 4
    port: 9413
    ipc_mode: shm
    log_level: info
    sleep: 4
    swim_enabled: false
    first_busy_wait: 200000
  - pkg_type: jarvis_clio_core.clio_cte
    pkg_name: cte_core
    devices:
    - - ram::cte_ram_tier1
      - 24GB
      - 1.0
    dpe_type: max_bw
    neighborhood: 1
    pool_query: local
    default_target_timeout_ms: 30000
    poll_period_ms: 5000
  - pkg_type: jarvis_clio_core.clio_cte_libfuse
    pkg_name: cte_fuse
    mountpoint: /tmp/cte_mnt
    log_level: info
    extra_fuse_args: -f
    attr_timeout: 1.0
    entry_timeout: 1.0
    negative_timeout: 1.0
    writeback: false
    max_write_kib: 1024
    max_background: 64
    max_readahead_kib: 1024
    sleep: 2
  - pkg_type: builtin.juicefs
    pkg_name: juicefs
    meta_url: redis://127.0.0.1:6379/1
    storage: file
    data_dir: ${HOME}/perf_eval_scratch/single_node_fuse_tuned/jfs_data
    mountpoint: /tmp/jfs_mnt
    cache_dir: /tmp/juicefs_cache
    name: jfsbench
    format_fresh: true
    mount_wait: 20
  - pkg_type: builtin.ior
    pkg_name: nfs_ior
    api: posix
    write: true
    read: true
    fpp: true
    xfer: 4k
    block: 64m
    nprocs: 1
    ppn: 1
    stonewall: 120
    out: ${HOME}/perf_eval_scratch/single_node_fuse_tuned/nfs/ior_nfs.bin
  - pkg_type: builtin.ior
    pkg_name: cte_ior
    api: posix
    write: true
    read: true
    fpp: true
    xfer: 4k
    block: 64m
    nprocs: 1
    ppn: 1
    stonewall: 120
    out: /tmp/cte_mnt/ior_cte.bin
  - pkg_type: builtin.redis-benchmark
    pkg_name: redis_bench
    port: 6379
    write: true
    read: true
    req_size: 4096
    count: 262144
    clients: 1
    nthreads: 1
  - pkg_type: builtin.ior
    pkg_name: jfs_ior
    api: posix
    write: true
    read: true
    fpp: true
    xfer: 4k
    block: 64m
    nprocs: 1
    ppn: 1
    stonewall: 120
    out: /tmp/jfs_mnt/ior_jfs.bin
vars:
  nfs_ior.xfer:
  - 4k
  - 64k
  - 128k
  - 1m
  cte_ior.xfer:
  - 4k
  - 64k
  - 128k
  - 1m
  jfs_ior.xfer:
  - 4k
  - 64k
  - 128k
  - 1m
  redis_bench.req_size:
  - 4096
  - 65536
  - 131072
  - 1048576
  redis_bench.count:
  - 262144
  - 16384
  - 8192
  - 1024
  nfs_ior.nprocs:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  nfs_ior.ppn:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  cte_ior.nprocs:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  cte_ior.ppn:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  jfs_ior.nprocs:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  jfs_ior.ppn:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  redis_bench.clients:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  redis_bench.nthreads:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
loop:
- - nfs_ior.xfer
  - cte_ior.xfer
  - jfs_ior.xfer
  - redis_bench.req_size
  - redis_bench.count
- - nfs_ior.nprocs
  - nfs_ior.ppn
  - cte_ior.nprocs
  - cte_ior.ppn
  - jfs_ior.nprocs
  - jfs_ior.ppn
  - redis_bench.clients
  - redis_bench.nthreads
run_timeout: 1200
repeat: 1
output: ${HOME}/single_node_fuse_tuned_results
