# =============================================================================
# WRITE SMOKE (BAREMETAL) -- fast CTE-only write check, no container.
# =============================================================================
#
# Same 4 points as write_smoke.yaml, but running the HOST spack install
# directly. There is no SIF, no docker, no apptainer: iowarp and ior are
# already installed in spack on this cluster, and rebuilding a 2 GB image to
# test a one-file adapter change costs over an hour for nothing.
#
# pre_cmds put `spack location -i iowarp` and `... ior` on PATH, so the code
# under test is whatever `spack install iowarp@<branch>` last produced --
# a ~minutes rebuild, since every dependency is already installed.

scheduler:
  name: slurm
  job_name: write_smoke_host
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 32
  partition: debug
  time: 00:40:00
  output: ${HOME}/write_smoke_host-%j.out
  error: ${HOME}/write_smoke_host-%j.err
  hostfile: ${HOME}/.jarvis-perf-eval/write_smoke_host_hostfile.txt
  pre_cmds:
  - APPTAINER_PREFIX=""
  - IOWARP_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack
    location -i iowarp 2>/dev/null || true )"
  - IOR_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack location
    -i ior 2>/dev/null || true )"
  - '[ -n "$IOWARP_PREFIX" ] || { echo "ERROR: iowarp not installed in spack" >&2; exit 1; }'
  - '[ -n "$IOR_PREFIX" ] || { echo "ERROR: ior not installed in spack" >&2; exit 1; }'
  - PATH="$IOWARP_PREFIX/bin:$IOR_PREFIX/bin:${JARVIS_VENV:-$HOME/jarvis-venv}/bin:$PATH"
  - LD_LIBRARY_PATH="$IOWARP_PREFIX/lib:$IOWARP_PREFIX/lib64:${LD_LIBRARY_PATH:-}"
  - export LD_LIBRARY_PATH
  - 'command -v jarvis >/dev/null 2>&1 || { echo "ERROR: jarvis not on PATH" >&2; exit 1; }'
  - 'echo "toolchain: jarvis=$(command -v jarvis) clio_run=$(command -v clio_run) clio_cte_fuse=$(command
    -v clio_cte_fuse) ior=$(command -v ior)"'
  - pkill -9 -f "[c]himaera" 2>/dev/null || true
  - pkill -9 -f "[c]lio_run" 2>/dev/null || true
  - pkill -9 -f "[c]lio_cte_fuse" 2>/dev/null || true
  - fusermount3 -u -z /tmp/cte_mnt_host 2>/dev/null || true
  - '{ command -v fuser >/dev/null 2>&1 && fuser -k 9413/tcp; } >/dev/null 2>&1 || true'
  - rm -f /dev/shm/chi_* 2>/dev/null || true
  - rm -rf /tmp/iowarp_chi* /tmp/write_smoke_host* /tmp/cte_mnt_host 2>/dev/null || true
  - mkdir -p "$HOME/write_smoke_host_results"
  - jarvis repo add "${CLIO_REPO:-$HOME/clio-core}/jarvis_clio_core" 2>/dev/null || true
  - rm -f "$HOME/write_smoke_host_results/results.csv"
  post_cmds:
  - fusermount3 -u -z /tmp/cte_mnt_host 2>/dev/null || true
  - pkill -9 -f "[c]lio_run" 2>/dev/null || true
  - rm -rf /tmp/iowarp_chi* /tmp/write_smoke_host* 2>/dev/null || true
  - rm -f /dev/shm/chi_* 2>/dev/null || true
  - RES="$HOME/write_smoke_host_results/results.csv"; echo "--- results ---"; cat "$RES" 2>/dev/null ||
    echo "no results"
config:
  name: write_smoke_host
  hostfile: ${HOME}/.jarvis-perf-eval/write_smoke_host_hostfile.txt
  host_pkgs:
  - install_method: spack
    install_query: apptainer~suid
  env:
    CLIO_MEMFD_DIR: /tmp/iowarp_chimaera_${USER}
  pkgs:
  - pkg_type: jarvis_clio_core.clio_runtime
    pkg_name: runtime
    num_threads: 4
    port: 9413
    ipc_mode: shm
    log_level: info
    sleep: 4
    swim_enabled: false
  - pkg_type: jarvis_clio_core.clio_cte
    pkg_name: cte_core
    devices:
    - - ram::cte_ram_tier1
      - 24GB
      - 1.0
    dpe_type: max_bw
    neighborhood: 1
    pool_query: local
    default_target_timeout_ms: 30000
    poll_period_ms: 5000
  - pkg_type: jarvis_clio_core.clio_cte_libfuse
    pkg_name: cte_fuse
    mountpoint: /tmp/cte_mnt_host
    log_level: info
    extra_fuse_args: -f
    attr_timeout: 1.0
    entry_timeout: 1.0
    negative_timeout: 1.0
    writeback: false
    max_write_kib: 1024
    max_background: 64
    max_readahead_kib: 1024
    sleep: 2
  - pkg_type: builtin.ior
    pkg_name: cte_ior
    api: posix
    write: true
    read: true
    fpp: true
    xfer: 4k
    block: 64m
    nprocs: 1
    ppn: 1
    stonewall: 120
    out: /tmp/cte_mnt_host/ior_cte.bin
vars:
  cte_ior.xfer:
  - 4k
  - 1m
  cte_ior.nprocs:
  - 1
  - 8
  cte_ior.ppn:
  - 1
  - 8
loop:
- - cte_ior.xfer
- - cte_ior.nprocs
  - cte_ior.ppn
run_timeout: 600
repeat: 1
output: ${HOME}/write_smoke_host_results
