# =============================================================================
# WRITE SMOKE (BAREMETAL) -- fast CTE-only write check, no container.
# =============================================================================
#
# Same 4 points as write_smoke.yaml, but running the HOST spack install
# directly. There is no SIF, no docker, no apptainer: iowarp and ior are
# already installed in spack on this cluster, and rebuilding a 2 GB image to
# test a one-file adapter change costs over an hour for nothing.
#
# pre_cmds put `spack location -i iowarp` and `... ior` on PATH, so the code
# under test is whatever `spack install iowarp@<branch>` last produced --
# a ~minutes rebuild, since every dependency is already installed.

scheduler:
  name: slurm
  job_name: write_smoke_host
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 32
  partition: debug
  time: 00:40:00
  output: ${HOME}/write_smoke_host-%j.out
  error: ${HOME}/write_smoke_host-%j.err
  hostfile: ${HOME}/.jarvis-perf-eval/write_smoke_host_hostfile.txt
  pre_cmds:
  - APPTAINER_PREFIX=""
  - 'IOWARP_SPEC_UNDER_TEST="${IOWARP_SPEC_UNDER_TEST:-iowarp@git.933-perf-eval-host-pkgs-apptainer=dev}"

    IOWARP_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack
    location -i "$IOWARP_SPEC_UNDER_TEST" 2>/dev/null || true )"'
  - IOR_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack location
    -i ior 2>/dev/null || true )"
  - MPI_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack location
    -i openmpi 2>/dev/null || true )"
  - '[ -n "$MPI_PREFIX" ] || { echo "ERROR: openmpi not installed in spack" >&2; exit 1; }'
  - '[ -n "$IOWARP_PREFIX" ] || { echo "ERROR: iowarp not installed in spack" >&2; exit 1; }'
  - '[ -n "$IOR_PREFIX" ] || { echo "ERROR: ior not installed in spack" >&2; exit 1; }'
  - PATH="$IOWARP_PREFIX/bin:$IOR_PREFIX/bin:$MPI_PREFIX/bin:${JARVIS_VENV:-$HOME/jarvis-venv}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  - LD_LIBRARY_PATH="$IOWARP_PREFIX/lib:$IOWARP_PREFIX/lib64:$MPI_PREFIX/lib:$MPI_PREFIX/lib64"
  - export LD_LIBRARY_PATH
  - 'command -v jarvis >/dev/null 2>&1 || { echo "ERROR: jarvis not on PATH" >&2; exit 1; }'
  - 'echo "toolchain: clio_run=$(command -v clio_run) clio_cte_fuse=$(command -v clio_cte_fuse) ior=$(command
    -v ior) mpiexec=$(command -v mpiexec)"'
  - echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
  - 'case ":$LD_LIBRARY_PATH:$PATH:" in *"/iowarp/core/build/bin"*) echo "ERROR: stale build tree still
    on path" >&2; exit 1;; esac'
  - 'command -v mpiexec >/dev/null 2>&1 || { echo "ERROR: mpiexec not on PATH" >&2; exit 1; }'
  - 'echo "iowarp spec under test: $IOWARP_SPEC_UNDER_TEST"; echo "iowarp prefix: $IOWARP_PREFIX"'
  - pkill -9 -f "[c]himaera" 2>/dev/null || true
  - pkill -9 -f "[c]lio_run" 2>/dev/null || true
  - pkill -9 -f "[c]lio_cte_fuse" 2>/dev/null || true
  - fusermount3 -u -z /tmp/cte_mnt_host 2>/dev/null || true
  - '{ command -v fuser >/dev/null 2>&1 && fuser -k 9413/tcp; } >/dev/null 2>&1 || true'
  - rm -f /dev/shm/chi_* 2>/dev/null || true
  - rm -rf /tmp/iowarp_chi* /tmp/write_smoke_host* /tmp/cte_mnt_host 2>/dev/null || true
  - mkdir -p "$HOME/write_smoke_host_results"
  - nohup bash -c 'for i in $(seq 1 400); do { date +%s; ps -L -o pid,tid,pcpu,comm -C clio_cte_fuse 2>/dev/null
    | head -12; ps -o pid,pcpu,comm -C clio_run 2>/dev/null | head -4; uptime; } ; sleep 1; done' > "$HOME/write_smoke_host_results/cpu_sample.txt"
    2>&1 &
  - jarvis repo add "${CLIO_REPO:-$HOME/clio-core}/jarvis_clio_core" 2>/dev/null || true
  - rm -f "$HOME/write_smoke_host_results/results.csv"
  post_cmds:
  - pkill -f 'while :; do :; done' 2>/dev/null || true
  - fusermount3 -u -z /tmp/cte_mnt_host 2>/dev/null || true
  - pkill -9 -f "[c]lio_run" 2>/dev/null || true
  - rm -rf /tmp/iowarp_chi* /tmp/write_smoke_host* 2>/dev/null || true
  - rm -f /dev/shm/chi_* 2>/dev/null || true
  - RES="$HOME/write_smoke_host_results/results.csv"; echo "--- results ---"; cat "$RES" 2>/dev/null ||
    echo "no results"
config:
  name: write_smoke_host
  hostfile: ${HOME}/.jarvis-perf-eval/write_smoke_host_hostfile.txt
  host_pkgs:
  - install_method: spack
    install_query: apptainer~suid
  env:
    CLIO_MEMFD_DIR: /tmp/iowarp_chimaera_${USER}
    CLIO_CFS_PROFILE_SUBMIT: '1'
    CLIO_CTE_FUSE_WRITE_STATS: '1'
    CLIO_CTE_FUSE_COALESCE: '1'
    CLIO_CTE_FUSE_WRITE_STATS_EVERY: '2000'
  pkgs:
  - pkg_type: jarvis_clio_core.clio_runtime
    pkg_name: runtime
    num_threads: 4
    port: 9413
    ipc_mode: shm
    log_level: info
    sleep: 4
    swim_enabled: false
    first_busy_wait: 200000
  - pkg_type: jarvis_clio_core.clio_cte
    pkg_name: cte_core
    devices:
    - - ram::cte_ram_tier1
      - 4GB
      - 1.0
    dpe_type: max_bw
    neighborhood: 1
    pool_query: local
    default_target_timeout_ms: 30000
    poll_period_ms: 5000
  - pkg_type: jarvis_clio_core.clio_cte_libfuse
    pkg_name: cte_fuse
    mountpoint: /tmp/cte_mnt_host
    log_level: info
    extra_fuse_args: -f
    attr_timeout: 1.0
    entry_timeout: 1.0
    negative_timeout: 1.0
    writeback: false
    max_write_kib: 0
    max_background: 0
    max_readahead_kib: 0
    sleep: 2
  - pkg_type: builtin.ior
    pkg_name: cte_ior
    api: posix
    write: true
    read: true
    fpp: true
    xfer: 4k
    block: 64m
    nprocs: 1
    ppn: 1
    stonewall: 120
    out: /tmp/cte_mnt_host/ior_cte.bin
  mpi_cmd: mpiexec --mca btl_tcp_if_include eno1 --mca oob_tcp_if_include eno1
vars:
  cte_ior.xfer:
  - 4k
  cte_ior.nprocs:
  - 1
  cte_ior.ppn:
  - 1
loop:
- - cte_ior.xfer
- - cte_ior.nprocs
  - cte_ior.ppn
run_timeout: 600
repeat: 2
output: ${HOME}/write_smoke_host_results
