# =============================================================================
# CFS chimod direct benchmark -- write_4k / read_4k only (issue #933).
# =============================================================================
#
# Drives the filesystem client's own API (CLIO_CFS_CLIENT open/read/write),
# with no FUSE and no interception, so the number is the chimod path itself.
#
# Reference points at 4 KiB, 1 thread, same node:
#   CTE core client, PutDefer   348.7 MiB/s   11.2 us/op
#   CTE core client, Put         96.5 MiB/s   40.5 us/op
#   full FUSE path               19.1 MiB/s  ~150 us/op
# This fills in the middle row: what the filesystem layer costs on top of
# core, without FUSE in the picture.

scheduler:
  name: slurm
  job_name: cfs_mixed_bench
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 32
  partition: debug
  time: 00:30:00
  output: ${HOME}/cfs_mixed_bench-%j.out
  error: ${HOME}/cfs_mixed_bench-%j.err
  hostfile: ${HOME}/.jarvis-perf-eval/cfs_mixed_bench_hostfile.txt
  pre_cmds:
  - APPTAINER_PREFIX=""
  - 'IOWARP_SPEC_UNDER_TEST="${IOWARP_SPEC_UNDER_TEST:-iowarp@git.933-perf-eval-host-pkgs-apptainer=dev}"

    IOWARP_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack
    location -i "$IOWARP_SPEC_UNDER_TEST" 2>/dev/null || true )"'
  - IOR_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack location
    -i ior 2>/dev/null || true )"
  - MPI_PREFIX="$( . "${SPACK_ROOT:-$HOME/spack}/share/spack/setup-env.sh" >/dev/null 2>&1 && spack location
    -i openmpi 2>/dev/null || true )"
  - '[ -n "$MPI_PREFIX" ] || { echo "ERROR: openmpi not installed in spack" >&2; exit 1; }'
  - '[ -n "$IOWARP_PREFIX" ] || { echo "ERROR: iowarp not installed in spack" >&2; exit 1; }'
  - '[ -n "$IOR_PREFIX" ] || { echo "ERROR: ior not installed in spack" >&2; exit 1; }'
  - PATH="$IOWARP_PREFIX/bin:$IOR_PREFIX/bin:$MPI_PREFIX/bin:${JARVIS_VENV:-$HOME/jarvis-venv}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  - LD_LIBRARY_PATH="$IOWARP_PREFIX/lib:$IOWARP_PREFIX/lib64:$MPI_PREFIX/lib:$MPI_PREFIX/lib64"
  - PATH="/mnt/common/llogan/iowarp/wt-933/build/bin:$PATH"
  - LD_LIBRARY_PATH="/mnt/common/llogan/iowarp/wt-933/build/bin:$LD_LIBRARY_PATH"
  - 'echo "using local build: clio_run=$(command -v clio_run)"'
  - export LD_LIBRARY_PATH
  - 'command -v jarvis >/dev/null 2>&1 || { echo "ERROR: jarvis not on PATH" >&2; exit 1; }'
  - 'echo "toolchain: clio_run=$(command -v clio_run) clio_cte_fuse=$(command -v clio_cte_fuse) ior=$(command
    -v ior) mpiexec=$(command -v mpiexec)"'
  - echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
  - 'case ":$LD_LIBRARY_PATH:$PATH:" in *"/iowarp/core/build/bin"*) echo "ERROR: stale build tree still
    on path" >&2; exit 1;; esac'
  - 'command -v mpiexec >/dev/null 2>&1 || { echo "ERROR: mpiexec not on PATH" >&2; exit 1; }'
  - 'echo "iowarp spec under test: $IOWARP_SPEC_UNDER_TEST"; echo "iowarp prefix: $IOWARP_PREFIX"'
  - pkill -9 -f "[c]himaera" 2>/dev/null || true
  - pkill -9 -f "[c]lio_run" 2>/dev/null || true
  - pkill -9 -f "[c]lio_cte_fuse" 2>/dev/null || true
  - fusermount3 -u -z /tmp/cte_mnt_host 2>/dev/null || true
  - '{ command -v fuser >/dev/null 2>&1 && fuser -k 9413/tcp; } >/dev/null 2>&1 || true'
  - rm -f /dev/shm/chi_* 2>/dev/null || true
  - rm -rf /tmp/iowarp_chi* /tmp/cfs_mixed_bench* /tmp/cte_mnt_host 2>/dev/null || true
  - mkdir -p "$HOME/cfs_mixed_bench_results"
  - nohup bash -c 'for i in $(seq 1 400); do { date +%s; ps -L -o pid,tid,pcpu,comm -C clio_cte_fuse 2>/dev/null
    | head -12; ps -o pid,pcpu,comm -C clio_run 2>/dev/null | head -4; uptime; } ; sleep 1; done' > "$HOME/cfs_mixed_bench_results/cpu_sample.txt"
    2>&1 &
  - jarvis repo add "${CLIO_REPO:-$HOME/clio-core}/jarvis_clio_core" 2>/dev/null || true
  - rm -f "$HOME/cfs_mixed_bench_results/results.csv"
  - mkdir -p "$HOME/cfs_bench_root"
  post_cmds:
  - echo "=== CFS chimod direct, write_4k/read_4k only ==="
  - pkill -f 'while :; do :; done' 2>/dev/null || true
  - fusermount3 -u -z /tmp/cte_mnt_host 2>/dev/null || true
  - pkill -9 -f "[c]lio_run" 2>/dev/null || true
  - rm -rf /tmp/iowarp_chi* /tmp/cfs_mixed_bench* 2>/dev/null || true
  - rm -f /dev/shm/chi_* 2>/dev/null || true
  - RES="$HOME/cfs_mixed_bench_results/results.csv"; echo "--- results ---"; cat "$RES" 2>/dev/null ||
    echo "no results"
config:
  name: cfs_mixed_bench
  hostfile: ${HOME}/.jarvis-perf-eval/cfs_mixed_bench_hostfile.txt
  env:
    CLIO_MEMFD_DIR: /tmp/iowarp_chimaera
    CLIO_CFS_CLIENT_SIDE_WRITE: ${CLIO_CFS_CLIENT_SIDE_WRITE:-0}
  pkgs:
  - pkg_type: jarvis_clio_core.clio_runtime
    pkg_name: runtime
    num_threads: 4
    port: 9413
    ipc_mode: shm
    log_level: info
    sleep: 4
    swim_enabled: false
    first_busy_wait: 200000
  - pkg_type: jarvis_clio_core.clio_cte
    pkg_name: cte_core
    devices:
    - - ram::cte_ram_tier1
      - 1GB
      - 1.0
    dpe_type: max_bw
    neighborhood: 1
    pool_query: local
    default_target_timeout_ms: 30000
    poll_period_ms: 5000
  - pkg_type: jarvis_clio_core.clio_cfs_bench
    pkg_name: cfs_bench
    mix: write_4k=50,read_4k=50
    duration: 20
    warmup: 5
    small_io: 4k
    max_data: 128m
    label: cfs_direct
    threads: 1
repeat: 1
run_timeout: 600
output: ${HOME}/cfs_mixed_bench_results
